<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Educación</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <img src="logo/logo.jpg" alt="Logo" width="120">
    <h1>Curriculum Vitae</h1>
    <nav>
    <a href="index.html">Inicio</a>
    <a href="educacion.html" class="activo">Educación</a>
    <a href="experiencia.html">Experiencia</a>
</nav>

</header>

<section>
    <h2>Educación</h2>

    <table id="tablaEducacion">
    <tr>
        <th>Año</th>
        <th>Institución</th>
        <th>Estudios</th>
        <th>Lugar</th>
        <th>¿Culminó?</th>
    </tr>
     <tr>
            <td>2022</td>
            <td>Universidad</td>
            <td>licenciatura en Informatica</td>
            <td>Barahona</td>
            <td>Sí</td>
        </tr>
    </table>

    <h3>Agregar Estudios</h3>
   <form onsubmit="agregarEstudio(event)">
    Año:
    <input type="number" id="año" required>

    Institución:
    <input type="text" id="institucion" required>

    Estudios:
    <input type="text" id="estudios" required>

    Lugar:
    <input type="text" id="lugar" required>

    ¿Culminó?
    <input type="radio" name="culmino" value="Sí" required> Sí
    <input type="radio" name="culmino" value="No"> No

    <input type="submit" value="Agregar Estudio">
</form>
    <button onclick="borrarEstudios()">Borrar todos los estudios</button>

</section>
<script>

document.addEventListener("DOMContentLoaded", cargarDatos);

function agregarEstudio(event) {
    event.preventDefault();

    let año = document.getElementById("año").value;
    let institucion = document.getElementById("institucion").value;
    let estudios = document.getElementById("estudios").value;
    let lugar = document.getElementById("lugar").value;
    let culmino = document.querySelector('input[name="culmino"]:checked').value;

    let nuevoEstudio = {
        año,
        institucion,
        estudios,
        lugar,
        culmino
    };

    let lista = JSON.parse(localStorage.getItem("estudios")) || [];
    lista.push(nuevoEstudio);

    localStorage.setItem("estudios", JSON.stringify(lista));

    mostrarEnTabla(nuevoEstudio);

    document.querySelector("form").reset();
}

function cargarDatos() {
    let lista = JSON.parse(localStorage.getItem("estudios")) || [];
    lista.forEach(mostrarEnTabla);
}

function mostrarEnTabla(estudio) {
    let tabla = document.getElementById("tablaEducacion");

    let fila = tabla.insertRow();

    fila.insertCell(0).innerText = estudio.año;
    fila.insertCell(1).innerText = estudio.institucion;
    fila.insertCell(2).innerText = estudio.estudios;
    fila.insertCell(3).innerText = estudio.lugar;
    fila.insertCell(4).innerText = estudio.culmino;
}

function borrarEstudios() {
    if (confirm("¿Seguro que deseas borrar todos los estudios?")) {

        localStorage.removeItem("estudios");

        let tabla = document.getElementById("tablaEducacion");

        while (tabla.rows.length > 1) {
            tabla.deleteRow(1);
        }
    }
}

</script>


</body>
</html>
